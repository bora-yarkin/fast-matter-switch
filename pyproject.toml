[project]
name = "fast-matter-switch"
version = "0.2.0"
description = "Fast Matter switch: Matter button events on the Home Assistant event bus at the first touch."
license = "GPL-3.0-or-later"
requires-python = ">=3.14"

[dependency-groups]
dev = ["pytest-homeassistant-custom-component", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 140
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "RUF012", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
